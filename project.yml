name: NoMoreTurtle
options:
  bundleIdPrefix: io.github.noahshin
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  NoMoreTurtle:
    type: application
    platform: macOS
    sources:
      - path: NoMoreTurtle
        excludes:
          - "Info.plist"
          - "NoMoreTurtle.entitlements"
    info:
      path: NoMoreTurtle/Info.plist
      properties:
        CFBundleDisplayName: No More Turtle
        CFBundleShortVersionString: "0.1.2"
        CFBundleVersion: "3"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSCameraUsageDescription: "거북목 자세를 감지하기 위해 카메라를 사용합니다."
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    entitlements:
      path: NoMoreTurtle/NoMoreTurtle.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.noahshin.NoMoreTurtle
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
